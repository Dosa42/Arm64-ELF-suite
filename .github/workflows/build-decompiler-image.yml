name: Build Vendor ELF Decompiler Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.decompiler
      - vendor-elf-decompiler-tool/**
      - .github/workflows/build-decompiler-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.decompiler
          push: true
          tags: ghcr.io/dosa42/arm64-elf-suite-decompiler:v9
          cache-from: type=gha
          cache-to: type=gha,mode=max

